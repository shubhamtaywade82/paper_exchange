version: 2
name: ruby-agent-skills

installation:
  installer: bin/install
  verifier: bin/skill-pack-verify
  doctor: bin/skill-pack-doctor
  metadata: .ruby-agent-skills/INSTALLATION.json

defaults:
  agent_workflow: agent-workflow
  always_consider:
    - ruby-clean-code
    - ruby-tdd-refactoring
    - stack-minimality
  require_repository_inspection: true
  require_tests_for_behavior_changes: true
  prefer_existing_conventions: true
  require_version_awareness: true

routing:
  contract: router/ROUTING.md
  cases: router/ROUTING_CASES.yml
  audit: scripts/audit_skill_routing.rb
  result_schema: docs/ROUTING_EVAL_RESULT_SCHEMA.md
  evaluation_runner: bin/routing-eval
  campaign_manifest: router/ROUTING_CAMPAIGN.yml
  ollama_adapter: bin/routing-agent-ollama
  campaign_runner: bin/routing-campaign
  campaign_analyzer: bin/routing-analyze
  remediation_policy: router/ROUTING_REMEDIATION.yml
  remediation_comparator: bin/routing-compare
  experiment_runner: bin/routing-experiment
  evidence_packager: bin/routing-evidence
  evidence_verifier: bin/routing-evidence-verify
  evidence_archiver: bin/routing-archive
  evidence_archive_schema: docs/ROUTING_EVIDENCE_ARCHIVE_SCHEMA.md
  campaign_verifier: bin/routing-campaign-verify
  campaign_intake_schema: docs/ROUTING_CAMPAIGN_INTAKE_SCHEMA.md
  campaign_evidence_packager: bin/routing-campaign-evidence
  campaign_evidence_schema: docs/ROUTING_CAMPAIGN_EVIDENCE_SCHEMA.md
  campaign_evidence_verifier: bin/routing-campaign-evidence-verify
  campaign_evidence_verification_schema: docs/ROUTING_CAMPAIGN_EVIDENCE_VERIFICATION_SCHEMA.md
  campaign_preflight: bin/routing-campaign-preflight
  campaign_preflight_schema: docs/ROUTING_CAMPAIGN_PREFLIGHT_SCHEMA.md
  external_handoff: bin/routing-campaign-handoff
  external_handoff_schema: docs/ROUTING_EXTERNAL_CAMPAIGN_SCHEMA.md
  external_handoff_verifier: bin/routing-campaign-handoff-verify
  hidden_benchmark_contract: router/ROUTING_HIDDEN_BENCHMARK.yml
  model_matrix_contract: router/ROUTING_MODEL_MATRIX.yml
  model_matrix_schema: docs/ROUTING_MODEL_MATRIX_SCHEMA.md
  model_matrix_campaign_runner: bin/routing-model-matrix-campaign
  hidden_benchmark_intake: bin/routing-hidden-benchmark-intake
  hidden_benchmark_intake_schema: docs/ROUTING_HIDDEN_BENCHMARK_INTAKE.md
  campaign_preflight_verifier: bin/routing-campaign-preflight-verify
  campaign_provenance_verifier: bin/routing-campaign-provenance-verify
  campaign_provenance_schema: docs/ROUTING_CAMPAIGN_PROVENANCE_BINDING.md
  campaign_intake_v2: bin/routing-campaign-import
  campaign_intake_v2_schema: docs/ROUTING_CAMPAIGN_INTAKE_V2.md
  evidence_schema: docs/ROUTING_EVIDENCE_SCHEMA.md

