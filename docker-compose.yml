services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: paper_user
      POSTGRES_PASSWORD: paper_password
      POSTGRES_DB: paper_exchange_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_user -d paper_exchange_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT:-3100}:3100"
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://paper_user:paper_password@db:5432/paper_exchange_development
      REDIS_URL: redis://redis:6379/0
      PORT: 3100
      # No default fallback: a missing RAILS_MASTER_KEY must fail loudly at
      # compose time instead of silently booting with a committed key (audit M1).
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY:?RAILS_MASTER_KEY must be set in .env - see .env.example}"
      # Same loud-failure policy for the API key (audit M2): without it the
      # API would 401 every request with no hint why.
      PAPER_EXCHANGE_API_KEY: "${PAPER_EXCHANGE_API_KEY:?PAPER_EXCHANGE_API_KEY must be set in .env - see .env.example}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules

  # Architecture alignment (target architecture §7): separate jobs process
  # for Solid Queue workers (matching, protection, liquidation, funding,
  # expiry). Runs independently of the web process so job throughput is
  # not affected by API request load.
  jobs:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: ["./bin/rails", "solid_queue:start"]
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://paper_user:paper_password@db:5432/paper_exchange_development
      REDIS_URL: redis://redis:6379/0
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY:?RAILS_MASTER_KEY must be set in .env}"
      PAPER_EXCHANGE_API_KEY: "${PAPER_EXCHANGE_API_KEY:?PAPER_EXCHANGE_API_KEY must be set in .env}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle

  # Architecture alignment (target architecture §7): market-data supervisor
  # process. Maintains WebSocket connections to Binance/CoinDCX, normalizes
  # events into QuoteStore + the Redis tick stream. Disabled by default —
  # enable with PAPER_EXCHANGE_ENABLE_BINANCE=true in .env. Only ONE
  # active market_data process should own subscriptions per provider/shard.
  market_data:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: ["./bin/market_data"]
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://paper_user:paper_password@db:5432/paper_exchange_development
      REDIS_URL: redis://redis:6379/0
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY:?RAILS_MASTER_KEY must be set in .env}"
      PAPER_EXCHANGE_API_KEY: "${PAPER_EXCHANGE_API_KEY:?PAPER_EXCHANGE_API_KEY must be set in .env}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["market_data"]
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
  node_modules:
