services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: paper_user
      POSTGRES_PASSWORD: paper_password
      POSTGRES_DB: paper_exchange_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_user -d paper_exchange_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3000"
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://paper_user:paper_password@db:5432/paper_exchange_production
      REDIS_URL: redis://redis:6379/0
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-f92a4815d4c57c5cf769f72276fb713a}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-5ced771bb117f9fae5cd5c0fb46976f9ed7e17e0143f260242b697de342bd4bde5f263dbe7ec44c49aea162cface5ec73c58e720a9f0e79be63cee26e2500ea1}
      PAPER_EXCHANGE_MARGIN: 10000.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
