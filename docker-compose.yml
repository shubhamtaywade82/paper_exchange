services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: paper_user
      POSTGRES_PASSWORD: paper_password
      POSTGRES_DB: paper_exchange_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_user -d paper_exchange_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT:-3100}:3100"
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://paper_user:paper_password@db:5432/paper_exchange_development
      REDIS_URL: redis://redis:6379/0
      PORT: 3100
      # No default fallback: a missing RAILS_MASTER_KEY must fail loudly at
      # compose time instead of silently booting with a committed key (audit M1).
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY:?RAILS_MASTER_KEY must be set in .env - see .env.example}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
  node_modules:
