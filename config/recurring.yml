# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Sweep open orders older than PAPER_EXCHANGE_ORDER_TTL_MINUTES (default
  # 60) so their locked margin is released instead of resting forever
  # (audit S2). See ExpireOrdersJob.
  expire_stale_orders:
    class: ExpireOrdersJob
    schedule: every 5 minutes

  # Architecture alignment: autonomous matching. The MatchingWorker consumes
  # market events from the Redis tick stream and fills open orders against
  # the latest quotes — this is what makes PaperExchange independent of the
  # trading bot staying alive. Runs every 2 seconds so resting orders fill
  # promptly when market conditions are met.
  run_matching_worker:
    class: MatchingWorkerJob
    schedule: every 2 seconds

  # Architecture alignment: autonomous position protection. Scans active
  # SL/TP/trailing-stop policies and triggers force-close orders when
  # breach conditions are met. Runs every 3 seconds so protections trigger
  # promptly on mark-price moves.
  run_protection_monitor:
    class: ProtectionMonitorJob
    schedule: every 3 seconds

  # Architecture alignment: option expiry settlement. Settles expiring
  # option positions (cash settlement for index options) at market close
  # daily. See OptionExpiryJob.
  settle_option_expiries:
    class: OptionExpiryJob
    schedule: every day at 15:30

  # Funding settlement is event-driven, not scheduled here — the provider
  # adapters (or the agent pushing POST /api/funding_events) enqueue
  # FundingJob directly when a funding settlement occurs.
