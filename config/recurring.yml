# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Binance USD-M perpetual futures settle funding at 00:00 / 08:00 / 16:00
  # UTC — anchor to those exact wall-clock hours rather than "every 8 hours"
  # (which would instead drift with whenever Solid Queue last booted).
  perpetual_futures_funding_settlement:
    class: FundingJob
    queue: risk
    schedule: "0 0,8,16 * * *"
