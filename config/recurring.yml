# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Sweep open orders older than PAPER_EXCHANGE_ORDER_TTL_MINUTES (default
  # 60) so their locked margin is released instead of resting forever
  # (audit S2). See ExpireOrdersJob.
  expire_stale_orders:
    class: ExpireOrdersJob
    schedule: every 5 minutes

  # Funding settlement is event-driven, not scheduled here — the trading bot
  # (which owns the Binance market-data connection) posts to
  # POST /api/funding_events when a funding event occurs, which enqueues
  # FundingJob directly. See Api::FundingEventsController.
