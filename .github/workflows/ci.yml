name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

      - name: Guard against committed secrets (audit M1 regression guard)
        run: |
          # Fails the build if any secret-shaped hex run (16+ hex chars) is
          # committed to a tracked file. 16+ catches Rails master keys (32 hex)
          # and secret_key_base (64+ hex).
          # Excluded from the scan:
          #   - Gemfile.lock and *.sum: checksums, not credentials.
          #   - diagrams/ and docs/diagrams/: SVG path data contains hex-like runs.
          # A SHA-256 digest written as `sha256:` followed by exactly 64 hex chars
          # (e.g. the OpenAPI source hash in clients/ts/index.ts) is an integrity
          # hash, not a credential, so the lookahead exempts it. Any other length
          # after `sha256:` still fails. The exemption is scoped to the digest
          # rather than the file, so a secret in the same file is still caught.
          # A real RAILS_MASTER_KEY shipped in .env.example once (audit M1,
          # 2026-09-25) and decrypted config/credentials.yml.enc.
          pattern='(?<![0-9a-fA-F])(?!(?<=sha256:)[0-9a-fA-F]{64}(?![0-9a-fA-F]))[0-9a-fA-F]{16,}'
          set +e
          git grep -InP "$pattern" -- . ':!Gemfile.lock' ':!*.sum' ':!diagrams/*' ':!docs/diagrams/*'
          status=$?
          set -e
          case "$status" in
            0)
              echo "::error::Secret-shaped hex string committed. Tracked files must use placeholders; real values belong only in the uncommitted .env (audit M1)."
              exit 1
              ;;
            1)
              echo "No secret-shaped hex strings found in tracked files."
              ;;
            *)
              # Exit >1 means git grep itself failed (e.g. PCRE unavailable). Fail
              # closed: a guard that silently passes on error is no guard.
              echo "::error::Secret guard could not run (git grep exit $status)."
              exit "$status"
              ;;
          esac

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # Prod-hardening (NEW-17): Redis was commented out, so CI was exercising
      # the Redis-unavailable degradation path (MarkPriceStore/TickProcessor
      # rescue Redis::BaseError -> nil) instead of the real production path.
      # The mark_prices / market_events / liquidation specs depend on Redis
      # being reachable to assert their happy-path behaviour truthfully.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          REDIS_URL: redis://localhost:6379/0
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        # `bin/rails test` is unrecognized in this API-only app (no Minitest
        # railtie); the suite is RSpec, which registers `bin/rails spec`.
        run: bin/rails db:test:prepare spec
